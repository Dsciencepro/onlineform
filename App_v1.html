<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accident Reporting — FAST</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1B2A4A; --navy-light: #2A3D5F;
  --amber: #D4910A; --amber-light: #FFF8E7; --amber-border: #E8C664;
  --surface: #F7F8FA; --white: #FFFFFF;
  --border: #D8DCE3; --border-light: #E8EBF0;
  --text: #1B2A4A; --muted: #5A6578;
  --green: #1A7A3A; --green-light: #EEFAF2; --green-border: #9DD4AE;
  --red: #B42E2E; --red-light: #FFF0F0;
  --blue: #2563EB; --blue-light: #EFF6FF; --blue-border: #93C5FD;
  --gray: #6B7280;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; color:var(--text); background:var(--surface); min-height:100vh; }

/* Header */
.header { background:var(--navy); color:#fff; padding:28px 24px 24px; position:sticky; top:0; z-index:100; }
.header h1 { font-size:18px; font-weight:700; letter-spacing:-0.01em; }
.header .sub { font-size:12px; color:rgba(255,255,255,0.55); margin-top:4px; }
.header-form { display:flex; align-items:center; gap:12px; padding:16px 20px; }
.header-form h1 { font-size:15px; flex:1; }
.header .conf { display:inline-block; font-size:10px; font-weight:600; letter-spacing:0.06em; background:rgba(255,255,255,0.12); padding:3px 8px; border-radius:3px; margin-top:10px; color:rgba(255,255,255,0.7); }

/* Layout */
.container { max-width:720px; margin:0 auto; padding:0 16px 100px; }

/* Cards */
.section { background:var(--white); border:1px solid var(--border); border-radius:8px; margin-top:16px; overflow:hidden; }
.section.accent { border-width:2px; }
.section-head { padding:16px 20px; border-bottom:1px solid var(--border-light); display:flex; align-items:center; gap:10px; }
.section-title { font-size:14px; font-weight:650; flex:1; }
.section-body { padding:16px 20px 20px; }

/* Dot */
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0; }

/* Badge */
.badge { font-size:10px; font-weight:600; border-radius:4px; padding:2px 8px; letter-spacing:0.02em; white-space:nowrap; border:1px solid; }

/* Form fields */
.field { margin-bottom:12px; }
.field label { display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:4px; letter-spacing:0.01em; }
.field input, .field select, .field textarea {
  width:100%; padding:8px 10px; font-size:13px; border:1px solid var(--border); border-radius:5px;
  background:var(--white); color:var(--text); font-family:inherit; outline:none; transition:border-color 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color:var(--navy); box-shadow:0 0 0 2px rgba(27,42,74,0.08); }
.field textarea { min-height:72px; resize:vertical; }

/* Grid helpers */
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.cg2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.cg3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

/* Checkboxes */
.check-item { display:flex; align-items:flex-start; gap:8px; font-size:13px; cursor:pointer; padding:4px 0; line-height:1.35; }
.check-box { width:16px; height:16px; border-radius:3px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; transition:all 0.15s; }
.check-box.on { border-color:var(--navy); background:var(--navy); }

/* Type cards */
.type-card { display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border:2px solid var(--border); border-radius:8px; background:var(--white); cursor:pointer; text-align:left; font-family:inherit; width:100%; transition:all 0.15s; }
.type-card.on { border-color:var(--card-color); background:color-mix(in srgb, var(--card-color) 3%, white); }
.type-card .icon { font-size:22px; flex-shrink:0; margin-top:1px; }
.type-card .name { font-size:13px; font-weight:650; }
.type-card .desc { font-size:11px; color:var(--muted); margin-top:2px; }
.type-card .tick { margin-left:auto; width:18px; height:18px; border-radius:4px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
.type-card.on .tick { border-color:var(--card-color); background:var(--card-color); }
.type-card.on .name { color:var(--card-color); }

/* Severity buttons */
.sev-btn { padding:10px 14px; border:1.5px solid var(--border); border-radius:6px; background:var(--white); cursor:pointer; text-align:left; font-family:inherit; width:100%; }
.sev-btn.on { border-color:var(--navy); background:rgba(27,42,74,0.03); }
.sev-btn .sev-label { font-size:12px; font-weight:600; }
.sev-btn.on .sev-label { color:var(--navy); }
.sev-btn .sev-desc { font-size:10px; color:var(--muted); margin-top:2px; }

/* Info boxes */
.info-box { margin-top:14px; padding:12px 16px; border-radius:6px; display:flex; align-items:center; gap:10px; font-size:12px; line-height:1.45; }
.info-blue { background:var(--blue-light); border:1px solid var(--blue-border); }
.info-green { background:var(--green-light); border:1px solid var(--green-border); color:var(--green); font-weight:500; }
.info-amber { background:var(--amber-light); border:1px solid var(--amber-border); color:var(--amber); font-weight:500; font-size:11px; }

/* Buttons */
.btn { font-family:inherit; cursor:pointer; border:none; border-radius:6px; font-weight:600; }
.btn-primary { background:var(--navy); color:#fff; padding:16px; font-size:14px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-sm { font-size:12px; padding:8px 14px; }
.btn-back { background:rgba(255,255,255,0.12); color:#fff; font-size:12px; padding:6px 12px; }
.btn-white { background:#fff; color:var(--navy); }
.btn-outline { background:none; border:1px solid rgba(255,255,255,0.25); color:#fff; }
.btn-link { background:none; border:none; font-size:12px; color:var(--blue); font-weight:600; font-family:inherit; cursor:pointer; padding:4px 0; }
.btn-esc { font-size:11px; font-weight:600; color:var(--blue); background:var(--white); border:1px solid var(--blue-border); border-radius:5px; padding:6px 14px; cursor:pointer; font-family:inherit; white-space:nowrap; }

/* Section divider */
.divider { border-top:1px solid var(--border-light); margin:16px 0; padding-top:16px; }
.sub-label { font-size:12px; font-weight:650; margin-bottom:10px; display:block; }

/* Bottom bar */
.bottom-bar { position:fixed; bottom:0; left:0; right:0; background:var(--navy); padding:10px 20px; display:flex; align-items:center; justify-content:space-between; z-index:100; }

/* Progress */
.progress-track { height:4px; background:var(--surface); border-radius:2px; }
.progress-fill { height:4px; border-radius:2px; transition:width 0.3s; }

/* Draft list */
.draft-card { background:var(--white); border:1px solid var(--border); border-radius:8px; padding:16px 18px; margin-bottom:10px; cursor:pointer; transition:border-color 0.15s; }
.draft-card:hover { border-color:var(--navy); }
.empty-state { text-align:center; padding:48px 20px; color:var(--muted); }

/* Animation */
.fade-in { animation: fadeSlide 0.3s ease; }
@keyframes fadeSlide { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* Responsive */
@media (max-width:600px) {
  .row2, .row3 { grid-template-columns:1fr; }
  .cg3 { grid-template-columns:1fr 1fr; }
  .type-grid { grid-template-columns:1fr !important; }
}
</style>
</head>
<body>

<!-- ═══════ LIST VIEW ═══════ -->
<div id="listView">
  <header class="header">
    <h1>Accident Reporting</h1>
    <p class="sub">Unified Incident Reports — FAST</p>
  </header>
  <div class="container" style="padding-top:16px">
    <button class="btn btn-primary" onclick="startNew()" style="margin-bottom:20px">
      <span style="font-size:20px">+</span> New Incident Report
    </button>
    <div id="draftList"></div>
  </div>
</div>

<!-- ═══════ FORM VIEW ═══════ -->
<div id="formView" style="display:none">
  <header class="header header-form" style="position:sticky;top:0;z-index:100">
    <button class="btn btn-back" onclick="backToList()">← Back</button>
    <div style="flex:1">
      <h1 style="font-size:15px;font-weight:700">Accident Report</h1>
      <div id="saveIndicator" style="font-size:10px;color:rgba(255,255,255,0.5);margin-top:2px">Auto-saves as you type</div>
    </div>
    <div style="text-align:right">
      <div id="progressPct" style="font-size:18px;font-weight:700;color:#fff">0%</div>
      <div style="width:60px;height:3px;background:rgba(255,255,255,0.15);border-radius:2px;margin-top:3px">
        <div id="progressBar" style="height:3px;background:#fff;border-radius:2px;width:0%;transition:width 0.3s"></div>
      </div>
    </div>
    <button class="btn btn-sm btn-white" onclick="exportPdf()">Export PDF</button>
  </header>

  <div class="container" id="formContainer"></div>
</div>

<script>
/* ═══════════════════ STATE ═══════════════════ */
const STORAGE_KEY = "fast_accident_reports";
let drafts = [];
let activeId = null;
let form = null;
let saveTimer = null;

const EMPTY = () => ({
  general: { company:"",project:"",incidentNo:"",incidentDate:"",incidentTime:"",reportedDateTime:"",reportedBy:"",phone:"",location:"",description:"",emergencyServices:[] },
  people: [{ name:"",employer:"",condition:"" }],
  types: { injury:false, vehicle:false, property:false, nearMiss:false },
  severity: "",
  escalated: false,
  injury: { empName:"",empId:"",dob:"",dateHired:"",sex:"",jobTitle:"",supervisor:"",physician:"",facility:"",erVisit:"",hospitalized:"",activityBefore:"",howOccurred:"",injuryDesc:"",objectSubstance:"",providerDate:"",nextAppt:"",workStatusNote:"",restrictions:"",returnDate:"",wcClaim:"",ppeInUse:"",bodyPart:"",firstAidProvider:"",firstAidDesc:"",returnedToWork:"" },
  vehicle: { driverName:"",driverPhone:"",licenseNo:"",licenseClass:"",empId:"",road:"",city:"",postedSpeed:"",driverSpeed:"",direction:"",weather:"",lighting:"",roadConditions:"",sceneDetails:[],yearMakeModel:"",color:"",unitNo:"",plate:"",vin:"",owner:"",insurance:"",damageDesc:"",otherDriverName:"",otherDriverPhone:"",otherVehicle:"",otherPlate:"",otherInsurance:"",otherPolicy:"",driverAccount:"" },
  property: { propOwner:"",contactPerson:"",contactInfo:"",propType:"",categories:[],damageDesc:"",estCost:"",estSource:"",claimNo:"",serviceInterrupted:"",duration:"",personName:"",equipment:"",qualification:"",factualDesc:"" },
  nearMiss: { couldHaveHappened:"",whyDidnt:"",recommendedAction:"" },
  investigation: { conditions:[],rootCause:"",actions:[{ action:"",person:"",dueDate:"" }] },
  notifications: { supervisor:"",safetyHr:"",clientGc:"",insuranceFleet:"",regRequired:"",flags:[] },
});

/* ═══════════════════ STORAGE ═══════════════════ */
function loadDrafts() {
  try { drafts = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch { drafts = []; }
}
function saveDrafts() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(drafts)); } catch {}
}
function saveCurrentForm() {
  if (!activeId || !form) return;
  const idx = drafts.findIndex(d => d.id === activeId);
  if (idx >= 0) {
    drafts[idx].form = JSON.parse(JSON.stringify(form));
    drafts[idx].updatedAt = new Date().toISOString();
    drafts[idx].progress = getProgress();
  }
  saveDrafts();
}

/* ═══════════════════ PROGRESS ═══════════════════ */
function getProgress() {
  if (!form) return 0;
  let f=0, t=0;
  const ck = v => { t++; if (v && (typeof v==="string"?v.trim():true)) f++; };
  const g = form.general;
  [g.company,g.project,g.incidentDate,g.incidentTime,g.reportedBy,g.location,g.description].forEach(ck);
  if (form.types.injury) { [form.injury.empName||form.injury.firstAidProvider,form.injury.howOccurred||form.injury.firstAidDesc].forEach(ck); }
  if (form.types.vehicle) { [form.vehicle.driverName,form.vehicle.licenseNo,form.vehicle.yearMakeModel,form.vehicle.driverAccount].forEach(ck); }
  if (form.types.property) { [form.property.propOwner,form.property.damageDesc,form.property.factualDesc].forEach(ck); }
  if (form.types.nearMiss) { [form.nearMiss.couldHaveHappened,form.nearMiss.recommendedAction].forEach(ck); }
  const any = form.types.injury||form.types.vehicle||form.types.property||form.types.nearMiss;
  if (any) ck(form.investigation.rootCause);
  return t===0?0:Math.round((f/t)*100);
}

/* ═══════════════════ AUTO-SAVE ═══════════════════ */
function triggerSave() {
  if (saveTimer) clearTimeout(saveTimer);
  const ind = document.getElementById("saveIndicator");
  saveTimer = setTimeout(() => {
    if (ind) ind.textContent = "Saving...";
    saveCurrentForm();
    updateProgress();
    if (ind) { ind.textContent = "✓ Saved"; setTimeout(() => { if(ind) ind.textContent = "Auto-saves as you type"; }, 2000); }
  }, 1500);
}

function updateProgress() {
  const p = getProgress();
  const pct = document.getElementById("progressPct");
  const bar = document.getElementById("progressBar");
  if (pct) pct.textContent = p + "%";
  if (bar) { bar.style.width = p + "%"; bar.style.background = p >= 80 ? "#4ADE80" : "#fff"; }
}

/* ═══════════════════ FIELD HELPERS ═══════════════════ */
function setVal(section, key, val) {
  if (section === "general") form.general[key] = val;
  else if (section === "injury") form.injury[key] = val;
  else if (section === "vehicle") form.vehicle[key] = val;
  else if (section === "property") form.property[key] = val;
  else if (section === "nearMiss") form.nearMiss[key] = val;
  else if (section === "investigation") form.investigation[key] = val;
  else if (section === "notifications") form.notifications[key] = val;
  triggerSave();
}

function toggleArr(section, key, item) {
  const arr = form[section][key] || [];
  const i = arr.indexOf(item);
  if (i >= 0) arr.splice(i, 1); else arr.push(item);
  form[section][key] = arr;
  triggerSave();
  renderForm();
}

function makeField(label, section, key, opts = {}) {
  const val = form[section]?.[key] || "";
  const id = `f_${section}_${key}`;
  if (opts.type === "select") {
    return `<div class="field"><label for="${id}">${label}</label><select id="${id}" onchange="setVal('${section}','${key}',this.value)"><option value="">Select...</option>${(opts.options||[]).map(o=>`<option value="${o}"${val===o?" selected":""}>${o}</option>`).join("")}</select></div>`;
  }
  if (opts.type === "textarea") {
    return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" placeholder="${opts.placeholder||""}" style="min-height:${(opts.rows||3)*24}px" oninput="setVal('${section}','${key}',this.value)">${val}</textarea></div>`;
  }
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${opts.type||"text"}" value="${val.replace(/"/g,"&quot;")}" placeholder="${opts.placeholder||""}" oninput="setVal('${section}','${key}',this.value)"></div>`;
}

function makeCheck(label, section, key) {
  const arr = form[section]?.[key] || [];
  const on = arr.includes(label);
  return `<label class="check-item" onclick="event.preventDefault();toggleArr('${section}','${key}','${label.replace(/'/g,"\\'")}')"><span class="check-box ${on?"on":""}">${on?'<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5.5L4 7.5L8 3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>':""}</span><span>${label}</span></label>`;
}

function makeBadge(label, color, bg, border) {
  return `<span class="badge" style="color:${color};background:${bg};border-color:${border}">${label}</span>`;
}

/* ═══════════════════ VIEW SWITCHING ═══════════════════ */
function showList() {
  document.getElementById("listView").style.display = "";
  document.getElementById("formView").style.display = "none";
  renderDraftList();
}
function showForm() {
  document.getElementById("listView").style.display = "none";
  document.getElementById("formView").style.display = "";
  renderForm();
  updateProgress();
}

/* ═══════════════════ DRAFT LIST ═══════════════════ */
function renderDraftList() {
  const el = document.getElementById("draftList");
  if (drafts.length === 0) {
    el.innerHTML = `<div class="empty-state"><div style="font-size:40px;margin-bottom:12px">📋</div><div style="font-size:14px;font-weight:500">No reports yet</div><div style="font-size:12px;margin-top:4px">Start a new report — your progress saves automatically.</div></div>`;
    return;
  }
  el.innerHTML = `<div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:10px;letter-spacing:0.02em">Saved Reports (${drafts.length})</div>` +
    drafts.map(d => {
      const f = d.form;
      const badges = [];
      if (f.types.injury) badges.push(makeBadge("Injury","#B42E2E","#FFF0F0","#E8A0A0"));
      if (f.types.vehicle) badges.push(makeBadge("Vehicle","#2563EB","#EFF6FF","#93C5FD"));
      if (f.types.property) badges.push(makeBadge("Property","#D4910A","#FFF8E7","#E8C664"));
      if (f.types.nearMiss) badges.push(makeBadge("Near Miss","#6B7280","#F3F4F6","#D1D5DB"));
      if (f.escalated) badges.push(makeBadge("Escalated","#2563EB","#EFF6FF","#93C5FD"));
      const p = d.progress || 0;
      const title = f.general.incidentNo || f.general.company || "Untitled Report";
      const updated = d.updatedAt ? new Date(d.updatedAt).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
      return `<div class="draft-card" onclick="openDraft('${d.id}')">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="font-size:13px;font-weight:600">${title}</div>
          <button onclick="event.stopPropagation();deleteDraft('${d.id}')" style="background:none;border:none;font-size:16px;color:var(--muted);cursor:pointer;padding:2px 6px" title="Delete">×</button>
        </div>
        ${f.general.location?`<div style="font-size:11px;color:var(--muted);margin-top:4px">${f.general.location}</div>`:""}
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap">${badges.length?badges.join(""):'<span style="font-size:11px;color:var(--muted);font-style:italic">No type selected</span>'}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
          <div class="progress-track" style="flex:1;margin-right:12px"><div class="progress-fill" style="background:${p>=80?"var(--green)":"var(--navy)"};width:${p}%"></div></div>
          <span style="font-size:10px;font-weight:600;color:${p>=80?"var(--green)":"var(--muted)"}">${p}%</span>
        </div>
        <div style="font-size:10px;color:var(--muted);margin-top:6px">${f.general.incidentDate?"Incident: "+f.general.incidentDate+" · ":""}Updated ${updated}</div>
      </div>`;
    }).join("");
}

function startNew() {
  const d = { id: Date.now().toString(), form: EMPTY(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), progress: 0 };
  drafts.unshift(d);
  saveDrafts();
  activeId = d.id;
  form = d.form;
  showForm();
}

function openDraft(id) {
  const d = drafts.find(x => x.id === id);
  if (!d) return;
  activeId = d.id;
  form = d.form;
  showForm();
}

function deleteDraft(id) {
  if (!confirm("Delete this draft? This cannot be undone.")) return;
  drafts = drafts.filter(d => d.id !== id);
  saveDrafts();
  renderDraftList();
}

function backToList() {
  saveCurrentForm();
  showList();
}

/* ═══════════════════ INCIDENT TYPE TOGGLE ═══════════════════ */
function toggleType(key) {
  form.types[key] = !form.types[key];
  triggerSave();
  renderForm();
}

function setSeverity(val) {
  form.severity = val;
  triggerSave();
  renderForm();
}

function escalateToMedical() {
  form.escalated = true;
  form.severity = "medical";
  triggerSave();
  renderForm();
}

function addPerson() {
  form.people.push({ name:"", employer:"", condition:"" });
  renderForm();
}

function setPersonField(idx, key, val) {
  form.people[idx][key] = val;
  triggerSave();
}

function addAction() {
  form.investigation.actions.push({ action:"", person:"", dueDate:"" });
  renderForm();
}

function setAction(idx, key, val) {
  form.investigation.actions[idx][key] = val;
  triggerSave();
}

/* ═══════════════════ RENDER FORM ═══════════════════ */
function renderForm() {
  const c = document.getElementById("formContainer");
  const anyType = form.types.injury || form.types.vehicle || form.types.property || form.types.nearMiss;
  const showMedical = form.severity==="medical"||form.severity==="hospital"||form.severity==="fatality"||form.escalated;

  let h = "";

  // ── GENERAL ──
  h += `<div class="section"><div class="section-head"><span class="dot" style="background:var(--navy)"></span><span class="section-title">General Information</span>${makeBadge("Always required","var(--muted)","var(--surface)","var(--border)")}</div><div class="section-body">`;
  h += `<div class="row3">${makeField("Company / Division","general","company",{placeholder:"e.g. FAST Construction"})}${makeField("Project / Location","general","project",{placeholder:"e.g. Highway 290 Phase II"})}${makeField("Internal Incident No.","general","incidentNo",{placeholder:"Auto-generated"})}</div>`;
  h += `<div class="row3">${makeField("Incident Date","general","incidentDate",{type:"date"})}${makeField("Incident Time","general","incidentTime",{type:"time"})}${makeField("Date/Time Reported","general","reportedDateTime",{type:"datetime-local"})}</div>`;
  h += `<div class="row2">${makeField("Reported By","general","reportedBy",{placeholder:"Full name"})}${makeField("Phone","general","phone",{type:"tel",placeholder:"(___) ___-____"})}</div>`;
  h += makeField("Exact Location of Event","general","location",{placeholder:"Specific area, intersection, floor, etc."});
  h += makeField("Brief Factual Description","general","description",{type:"textarea",placeholder:"What happened, where, and what work was underway. Do not assign blame.",rows:4});
  h += `<div style="margin-top:4px"><label style="display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">Emergency Services</label><div class="cg3">${["Police called","Fire/ambulance called","Emergency room","Drug/alcohol test","Photos taken","None"].map(i=>makeCheck(i,"general","emergencyServices")).join("")}</div></div>`;
  h += `</div></div>`;

  // ── PEOPLE ──
  h += `<div class="section"><div class="section-head"><span class="dot" style="background:var(--navy)"></span><span class="section-title">People Involved</span></div><div class="section-body">`;
  form.people.forEach((p,i) => {
    h += `<div class="row3"><div class="field"><label>Name</label><input value="${(p.name||"").replace(/"/g,"&quot;")}" placeholder="Full name" oninput="setPersonField(${i},'name',this.value)"></div><div class="field"><label>Employer / Role</label><input value="${(p.employer||"").replace(/"/g,"&quot;")}" placeholder="e.g. Journeyman electrician" oninput="setPersonField(${i},'employer',this.value)"></div><div class="field"><label>Injury or Condition</label><input value="${(p.condition||"").replace(/"/g,"&quot;")}" placeholder="e.g. Laceration, right hand" oninput="setPersonField(${i},'condition',this.value)"></div></div>`;
  });
  h += `<button class="btn-link" onclick="addPerson()">+ Add another person</button></div></div>`;

  // ── INCIDENT TYPE ──
  const tc = (key, label, icon, desc, color) => {
    const on = form.types[key];
    return `<button class="type-card ${on?"on":""}" style="--card-color:${color}" onclick="toggleType('${key}')"><span class="icon">${icon}</span><div style="flex:1"><div class="name">${label}</div><div class="desc">${desc}</div></div><span class="tick">${on?'<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5.5L4 7.5L8 3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':""}</span></button>`;
  };
  h += `<div class="section"><div class="section-head"><span class="dot" style="background:var(--amber)"></span><span class="section-title">Incident Type</span>${makeBadge("Select all that apply","var(--amber)","var(--amber-light)","var(--amber-border)")}</div><div class="section-body">`;
  h += `<p style="font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5">Select every category that applies. Additional sections will appear below.</p>`;
  h += `<div class="type-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">`;
  h += tc("injury","Employee Injury / Illness","🩹","Work-related injury, illness, or exposure","#B42E2E");
  h += tc("vehicle","Vehicle Incident","🚗","Company, rental, or personal vehicle on business","#2563EB");
  h += tc("property","Property Damage","🏗️","Damage to property, equipment, or utilities","#D4910A");
  h += tc("nearMiss","Near Miss","⚠️","No injury or damage but potential for either","#6B7280");
  h += `</div></div></div>`;

  // ── SEVERITY ──
  if (form.types.injury) {
    const sb = (val,label,desc) => `<button class="sev-btn ${form.severity===val?"on":""}" onclick="setSeverity('${val}')"><div class="sev-label">${label}</div><div class="sev-desc">${desc}</div></button>`;
    h += `<div class="section fade-in"><div class="section-head"><span class="dot" style="background:var(--red)"></span><span class="section-title">Severity / Treatment Level</span></div><div class="section-body">`;
    h += `<p style="font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5">Select the current treatment level. You can escalate later if the situation changes.</p>`;
    h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${sb("firstAid","First Aid Only","On-site treatment, no outside medical care")}${sb("medical","Medical Treatment","Clinic, doctor, or occupational medicine visit")}${sb("hospital","Hospitalization","Emergency room or overnight in-patient stay")}${sb("fatality","Fatality","Death resulting from incident")}</div>`;
    if (form.severity==="firstAid" && !form.escalated) {
      h += `<div class="info-box info-blue"><span style="flex:1">If this case later requires medical treatment, you can escalate without starting a new report.</span><button class="btn-esc" onclick="escalateToMedical()">Escalate now</button></div>`;
    }
    if (form.escalated) {
      h += `<div class="info-box info-green">✓ Escalated from First Aid to Medical Treatment — additional fields opened below.</div>`;
    }
    h += `</div></div>`;
  }

  // ── FIRST AID ONLY ──
  if (form.types.injury && form.severity==="firstAid" && !form.escalated) {
    h += `<div class="section accent fade-in" style="border-color:var(--red)"><div class="section-head" style="border-bottom-color:rgba(180,46,46,0.2)"><span style="font-size:18px">🩹</span><span class="section-title" style="color:var(--red)">First Aid Report</span>${makeBadge("Required","var(--red)","var(--red-light)","rgba(180,46,46,0.4)")}</div><div class="section-body">`;
    h += makeField("First Aid Provider","injury","firstAidProvider",{placeholder:"Name of person who administered first aid"});
    h += makeField("First Aid Provided","injury","firstAidDesc",{type:"textarea",placeholder:"Describe the first aid treatment given",rows:3});
    h += `<div class="row2">${makeField("PPE In Use","injury","ppeInUse",{placeholder:"e.g. Hard hat, safety glasses"})}${makeField("Body Part(s) Affected","injury","bodyPart",{placeholder:"e.g. Right index finger"})}</div>`;
    h += makeField("Employee Returned to Work?","injury","returnedToWork",{type:"select",options:["Yes — same shift","Yes — next shift","No — sent home"]});
    h += `</div></div>`;
  }

  // ── FULL MEDICAL ──
  if (form.types.injury && showMedical) {
    h += `<div class="section accent fade-in" style="border-color:var(--red)"><div class="section-head" style="border-bottom-color:rgba(180,46,46,0.2)"><span style="font-size:18px">🩹</span><span class="section-title" style="color:var(--red)">Employee Injury / Illness — Full Report</span>${makeBadge("Required","var(--red)","var(--red-light)","rgba(180,46,46,0.4)")}</div><div class="section-body">`;
    h += `<p style="font-size:11px;color:var(--muted);margin:0 0 14px;font-style:italic">OSHA 301-equivalent fields. Do not include PII in narrative fields.</p>`;
    h += `<div class="row2">${makeField("Employee Full Name","injury","empName")}${makeField("Employee ID","injury","empId",{placeholder:"Do not use SSN"})}</div>`;
    h += `<div class="row3">${makeField("Date of Birth","injury","dob",{type:"date"})}${makeField("Date Hired","injury","dateHired",{type:"date"})}${makeField("Sex","injury","sex",{type:"select",options:["Male","Female"]})}</div>`;
    h += `<div class="row2">${makeField("Job Title / Department","injury","jobTitle")}${makeField("Supervisor","injury","supervisor")}</div>`;
    h += `<div class="divider"><span class="sub-label" style="color:var(--red)">Health Care Information</span>`;
    h += `<div class="row2">${makeField("Physician","injury","physician")}${makeField("Treatment Facility","injury","facility",{placeholder:"Name and address"})}</div>`;
    h += `<div class="row2">${makeField("Treated in ER?","injury","erVisit",{type:"select",options:["Yes","No"]})}${makeField("Hospitalized Overnight?","injury","hospitalized",{type:"select",options:["Yes","No"]})}</div></div>`;
    h += `<div class="divider"><span class="sub-label" style="color:var(--red)">Incident Details (OSHA 301 Items 14–17)</span>`;
    h += makeField("Activity Before Incident","injury","activityBefore",{type:"textarea",placeholder:"What was the employee doing just before?",rows:3});
    h += makeField("How the Incident Occurred","injury","howOccurred",{type:"textarea",placeholder:"Sequence of events.",rows:4});
    h += makeField("Injury or Illness Description","injury","injuryDesc",{type:"textarea",placeholder:"Body part(s) affected.",rows:3});
    h += makeField("Object or Substance","injury","objectSubstance",{type:"textarea",placeholder:"What directly harmed the employee?",rows:2});
    h += `</div>`;
    h += `<div class="divider"><span class="sub-label" style="color:var(--red)">Medical and Work Status</span>`;
    h += `<div class="row3">${makeField("Provider Visit Date","injury","providerDate",{type:"date"})}${makeField("Next Appointment","injury","nextAppt",{type:"date"})}${makeField("Work Status Note?","injury","workStatusNote",{type:"select",options:["Yes","No"]})}</div>`;
    h += `<div class="row2">${makeField("Restrictions","injury","restrictions")}${makeField("Return to Duty Date","injury","returnDate",{type:"date"})}</div>`;
    h += makeField("Workers' Comp Claim No.","injury","wcClaim");
    if (form.escalated) h += `<div class="info-box info-amber">Escalated from First Aid. Enter the date treatment was sought and updated diagnosis.</div>`;
    h += `</div></div></div>`;
  }

  // ── VEHICLE ──
  if (form.types.vehicle) {
    h += `<div class="section accent fade-in" style="border-color:var(--blue)"><div class="section-head" style="border-bottom-color:rgba(37,99,235,0.2)"><span style="font-size:18px">🚗</span><span class="section-title" style="color:var(--blue)">Vehicle Incident</span>${makeBadge("Required","var(--blue)","var(--blue-light)","var(--blue-border)")}</div><div class="section-body">`;
    h += `<div class="row2">${makeField("Driver Name","vehicle","driverName")}${makeField("Driver Phone","vehicle","driverPhone",{type:"tel"})}</div>`;
    h += `<div class="row3">${makeField("Driver License No. / State","vehicle","licenseNo")}${makeField("License Class / Expiration","vehicle","licenseClass")}${makeField("Employee ID","vehicle","empId")}</div>`;
    h += `<div class="divider"><span class="sub-label" style="color:var(--blue)">Accident Details</span>`;
    h += `<div class="row2">${makeField("Road / Intersection","vehicle","road")}${makeField("City / State","vehicle","city")}</div>`;
    h += `<div class="row3">${makeField("Posted Speed","vehicle","postedSpeed")}${makeField("Driver Speed","vehicle","driverSpeed")}${makeField("Direction","vehicle","direction")}</div>`;
    h += `<div class="row3">${makeField("Weather","vehicle","weather")}${makeField("Lighting","vehicle","lighting")}${makeField("Road Conditions","vehicle","roadConditions")}</div>`;
    h += `<div style="margin-top:4px"><label style="display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">Scene Details</label><div class="cg3">${["Police called","Fire/ambulance","Tow required","Vehicle drivable","Photos taken","Dashcam available","Citation issued","Drug/alcohol test"].map(i=>makeCheck(i,"vehicle","sceneDetails")).join("")}</div></div></div>`;
    h += `<div class="divider"><span class="sub-label" style="color:var(--blue)">Company Vehicle</span>`;
    h += `<div class="row3">${makeField("Year / Make / Model","vehicle","yearMakeModel")}${makeField("Color","vehicle","color")}${makeField("Unit No.","vehicle","unitNo")}</div>`;
    h += `<div class="row2">${makeField("License Plate / State","vehicle","plate")}${makeField("VIN","vehicle","vin")}</div>`;
    h += `<div class="row2">${makeField("Owner / Lease Company","vehicle","owner")}${makeField("Insurance Carrier / Policy","vehicle","insurance")}</div>`;
    h += makeField("Damage Description","vehicle","damageDesc",{type:"textarea",placeholder:"Describe damage and location on vehicle",rows:3});
    h += `</div>`;
    h += `<div class="divider"><span class="sub-label" style="color:var(--blue)">Other Driver / Vehicle</span>`;
    h += `<div class="row2">${makeField("Other Driver Name","vehicle","otherDriverName")}${makeField("Other Driver Phone","vehicle","otherDriverPhone")}</div>`;
    h += `<div class="row2">${makeField("Other Vehicle","vehicle","otherVehicle")}${makeField("Other Plate / State","vehicle","otherPlate")}</div>`;
    h += `<div class="row2">${makeField("Other Insurance","vehicle","otherInsurance")}${makeField("Other Policy No.","vehicle","otherPolicy")}</div></div>`;
    h += makeField("Driver's Factual Account","vehicle","driverAccount",{type:"textarea",placeholder:"Travel, traffic controls, actions of each vehicle, point of impact.",rows:5});
    h += `</div></div>`;
  }

  // ── PROPERTY ──
  if (form.types.property) {
    h += `<div class="section accent fade-in" style="border-color:var(--amber)"><div class="section-head" style="border-bottom-color:rgba(212,145,10,0.2)"><span style="font-size:18px">🏗️</span><span class="section-title" style="color:var(--amber)">Property Damage</span>${makeBadge("Required","var(--amber)","var(--amber-light)","var(--amber-border)")}</div><div class="section-body">`;
    h += `<div class="row2">${makeField("Property Owner","property","propOwner")}${makeField("Contact Person","property","contactPerson")}</div>`;
    h += `<div class="row2">${makeField("Phone / Email","property","contactInfo")}${makeField("Property Type / Asset ID","property","propType")}</div>`;
    h += `<div style="margin:4px 0 12px"><label style="display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">Property Category</label><div class="cg3">${["Company property","Customer/GC property","Public property","Third-party property","Rental equipment","Utility","Environmental release","Business interruption"].map(i=>makeCheck(i,"property","categories")).join("")}</div></div>`;
    h += makeField("Describe the Property and Damage","property","damageDesc",{type:"textarea",placeholder:"Location, dimensions, operability, temporary repairs.",rows:4});
    h += `<div class="row3">${makeField("Est. Cost","property","estCost",{placeholder:"$"})}${makeField("Estimate Source / Date","property","estSource")}${makeField("Insurance / Claim No.","property","claimNo")}</div>`;
    h += `<div class="row2">${makeField("Service Interrupted?","property","serviceInterrupted",{type:"select",options:["No","Yes"]})}${makeField("Duration / Impact","property","duration")}</div>`;
    h += `<div class="divider"><span class="sub-label" style="color:var(--amber)">People and Equipment Involved</span>`;
    h += `<div class="row3">${makeField("Name / Employer / Role","property","personName")}${makeField("Equipment / Tool","property","equipment")}${makeField("Operator Qualification","property","qualification")}</div></div>`;
    h += makeField("Factual Description and Sequence","property","factualDesc",{type:"textarea",placeholder:"What work was planned, what occurred, how property was damaged.",rows:5});
    h += `</div></div>`;
  }

  // ── NEAR MISS ──
  if (form.types.nearMiss && !form.types.injury && !form.types.vehicle && !form.types.property) {
    h += `<div class="section accent fade-in" style="border-color:var(--gray)"><div class="section-head"><span style="font-size:18px">⚠️</span><span class="section-title" style="color:var(--gray)">Near Miss Report</span>${makeBadge("Required","var(--gray)","#F3F4F6","#D1D5DB")}</div><div class="section-body">`;
    h += makeField("What Could Have Happened","nearMiss","couldHaveHappened",{type:"textarea",placeholder:"Potential injury, damage, or environmental impact.",rows:3});
    h += makeField("Why It Didn't Happen","nearMiss","whyDidnt",{type:"textarea",placeholder:"What prevented it?",rows:3});
    h += makeField("Recommended Action","nearMiss","recommendedAction",{type:"textarea",placeholder:"What should be done to prevent this?",rows:3});
    h += `</div></div>`;
  }

  // ── INVESTIGATION ──
  if (anyType) {
    h += `<div class="section fade-in"><div class="section-head"><span class="dot" style="background:var(--green)"></span><span class="section-title">Investigation and Corrective Action</span></div><div class="section-body">`;
    h += `<label style="display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">Contributing Conditions</label>`;
    h += `<div class="cg3" style="margin-bottom:14px">${["Procedure / work planning","Training / qualification","Supervision","Equipment / tool","Guarding / energy control","PPE","Housekeeping / access","Environmental condition","Communication"].map(i=>makeCheck(i,"investigation","conditions")).join("")}</div>`;
    h += makeField("Root Cause Analysis","investigation","rootCause",{type:"textarea",placeholder:"Facts and evidence — do not use blame-only conclusions.",rows:4});
    h += `<div class="divider"><span class="sub-label" style="color:var(--green)">Corrective Action Plan</span>`;
    form.investigation.actions.forEach((a,i) => {
      h += `<div class="row3"><div class="field"><label>Corrective Action</label><input value="${(a.action||"").replace(/"/g,"&quot;")}" oninput="setAction(${i},'action',this.value)"></div><div class="field"><label>Responsible Person</label><input value="${(a.person||"").replace(/"/g,"&quot;")}" oninput="setAction(${i},'person',this.value)"></div><div class="field"><label>Due Date</label><input type="date" value="${a.dueDate||""}" oninput="setAction(${i},'dueDate',this.value)"></div></div>`;
    });
    h += `<button class="btn-link" onclick="addAction()">+ Add another action</button></div></div></div>`;

    // ── NOTIFICATIONS ──
    h += `<div class="section fade-in"><div class="section-head"><span class="dot" style="background:var(--navy)"></span><span class="section-title">Notifications and Approvals</span></div><div class="section-body">`;
    h += `<div class="row3">${makeField("Supervisor","notifications","supervisor")}${makeField("Safety / HR","notifications","safetyHr")}${makeField("Client / GC","notifications","clientGc")}</div>`;
    h += `<div class="row2">${makeField("Insurance / Fleet","notifications","insuranceFleet")}${makeField("Regulatory Report Required?","notifications","regRequired",{type:"select",options:["No","Yes","Pending"]})}</div>`;
    h += `<div style="margin-top:4px"><label style="display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">Additional Flags</label><div class="cg2">${["Preserve scene / evidence","Potential regulator-reportable event"].map(i=>makeCheck(i,"notifications","flags")).join("")}</div></div>`;
    h += `</div></div>`;
  }

  // ── BOTTOM BAR ──
  if (anyType) {
    const badges = [];
    if (form.types.injury) badges.push(makeBadge("Injury","#fff","rgba(180,46,46,0.7)","rgba(180,46,46,0.9)"));
    if (form.types.vehicle) badges.push(makeBadge("Vehicle","#fff","rgba(37,99,235,0.7)","rgba(37,99,235,0.9)"));
    if (form.types.property) badges.push(makeBadge("Property","#fff","rgba(212,145,10,0.7)","rgba(212,145,10,0.9)"));
    if (form.types.nearMiss) badges.push(makeBadge("Near Miss","#fff","rgba(107,114,128,0.7)","rgba(107,114,128,0.9)"));
    if (form.escalated) badges.push(makeBadge("Escalated","#fff","rgba(37,99,235,0.5)","rgba(37,99,235,0.7)"));
    h += `<div class="bottom-bar"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${badges.join("")}</div><button class="btn btn-sm btn-outline" onclick="exportPdf()">Export PDF</button></div>`;
  }

  h += `<div style="height:24px"></div>`;
  c.innerHTML = h;
}

/* ═══════════════════ PDF EXPORT ═══════════════════ */
function exportPdf() {
  const f = form;
  const types = [];
  if (f.types.injury) types.push("Employee Injury/Illness");
  if (f.types.vehicle) types.push("Vehicle Incident");
  if (f.types.property) types.push("Property Damage");
  if (f.types.nearMiss) types.push("Near Miss");
  const showMedical = f.severity==="medical"||f.severity==="hospital"||f.severity==="fatality"||f.escalated;

  const row = (l,v) => v?`<tr><td style="padding:5px 10px;font-weight:600;color:#5A6578;font-size:11px;width:200px;vertical-align:top;border-bottom:1px solid #eee">${l}</td><td style="padding:5px 10px;font-size:12px;border-bottom:1px solid #eee">${v}</td></tr>`:"";
  const heading = (t,c="#1B2A4A") => `<h2 style="font-size:14px;color:${c};margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid ${c}">${t}</h2>`;
  const narr = (l,v) => v?`<div style="margin:10px 0"><div style="font-size:11px;font-weight:600;color:#5A6578;margin-bottom:4px">${l}</div><div style="font-size:12px;line-height:1.6;padding:8px 10px;background:#F7F8FA;border-radius:4px;white-space:pre-wrap">${v}</div></div>`:"";
  const chips = items => items.length?`<div style="font-size:11px;margin:6px 0">${items.map(i=>`<span style="display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;background:#EFF6FF;border:1px solid #93C5FD;border-radius:3px;font-size:10px">${i}</span>`).join("")}</div>`:"";

  let p = getProgress();
  let html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Accident Report</title><style>@page{size:letter;margin:0.75in}body{font-family:Arial,sans-serif;color:#1B2A4A;font-size:12px;line-height:1.5;margin:0}table{width:100%;border-collapse:collapse}</style></head><body>`;
  html += `<div style="background:#1B2A4A;color:white;padding:20px 24px"><div style="font-size:18px;font-weight:700">Accident Reporting and Investigation Record</div><div style="font-size:11px;opacity:0.6;margin-top:4px">CONFIDENTIAL — ${types.join(" + ")||"Draft"} ${f.escalated?"— ESCALATED":""}</div></div>`;
  html += `<div style="padding:20px 24px"><div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:11px;color:#5A6578"><span>Completion: ${p}%</span><span>Generated: ${new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})}</span></div>`;

  html += heading("General Information");
  html += `<table>${row("Company",f.general.company)}${row("Project",f.general.project)}${row("Incident No.",f.general.incidentNo)}${row("Incident Date",f.general.incidentDate)}${row("Incident Time",f.general.incidentTime)}${row("Reported By",f.general.reportedBy)}${row("Phone",f.general.phone)}${row("Location",f.general.location)}</table>`;
  html += narr("Brief Factual Description", f.general.description);
  if (f.general.emergencyServices?.length) html += chips(f.general.emergencyServices);

  const pp = f.people.filter(p=>p.name);
  if (pp.length) { html += heading("People Involved"); html += `<table>${pp.map(p=>`${row("Name",p.name)}${row("Role",p.employer)}${row("Condition",p.condition)}`).join("")}</table>`; }

  if (f.types.injury) {
    html += heading("Employee Injury / Illness","#B42E2E");
    if (f.severity==="firstAid"&&!f.escalated) {
      html += `<table>${row("First Aid Provider",f.injury.firstAidProvider)}${row("PPE",f.injury.ppeInUse)}${row("Body Part(s)",f.injury.bodyPart)}${row("Returned to Work",f.injury.returnedToWork)}</table>`;
      html += narr("First Aid Provided",f.injury.firstAidDesc);
    }
    if (showMedical) {
      html += `<table>${row("Employee",f.injury.empName)}${row("Employee ID",f.injury.empId)}${row("DOB",f.injury.dob)}${row("Date Hired",f.injury.dateHired)}${row("Sex",f.injury.sex)}${row("Job Title",f.injury.jobTitle)}${row("Supervisor",f.injury.supervisor)}${row("Physician",f.injury.physician)}${row("Facility",f.injury.facility)}${row("ER Visit",f.injury.erVisit)}${row("Hospitalized",f.injury.hospitalized)}${row("Provider Date",f.injury.providerDate)}${row("Restrictions",f.injury.restrictions)}${row("Return Date",f.injury.returnDate)}${row("WC Claim",f.injury.wcClaim)}</table>`;
      html += narr("Activity Before",f.injury.activityBefore);
      html += narr("How It Occurred",f.injury.howOccurred);
      html += narr("Injury Description",f.injury.injuryDesc);
      html += narr("Object/Substance",f.injury.objectSubstance);
    }
  }
  if (f.types.vehicle) {
    html += heading("Vehicle Incident","#2563EB");
    html += `<table>${row("Driver",f.vehicle.driverName)}${row("License",f.vehicle.licenseNo)}${row("Road",f.vehicle.road)}${row("City",f.vehicle.city)}${row("Weather",f.vehicle.weather)}${row("Vehicle",f.vehicle.yearMakeModel)}${row("Plate",f.vehicle.plate)}${row("VIN",f.vehicle.vin)}${row("Insurance",f.vehicle.insurance)}</table>`;
    if (f.vehicle.sceneDetails?.length) html += chips(f.vehicle.sceneDetails);
    html += narr("Damage",f.vehicle.damageDesc);
    html += `<table>${row("Other Driver",f.vehicle.otherDriverName)}${row("Other Vehicle",f.vehicle.otherVehicle)}${row("Other Insurance",f.vehicle.otherInsurance)}</table>`;
    html += narr("Driver's Account",f.vehicle.driverAccount);
  }
  if (f.types.property) {
    html += heading("Property Damage","#D4910A");
    html += `<table>${row("Owner",f.property.propOwner)}${row("Contact",f.property.contactPerson)}${row("Est. Cost",f.property.estCost)}${row("Claim No.",f.property.claimNo)}</table>`;
    if (f.property.categories?.length) html += chips(f.property.categories);
    html += narr("Damage Description",f.property.damageDesc);
    html += narr("Factual Description",f.property.factualDesc);
  }
  if (f.types.nearMiss) {
    html += heading("Near Miss","#6B7280");
    html += narr("Could Have Happened",f.nearMiss.couldHaveHappened);
    html += narr("Why It Didn't",f.nearMiss.whyDidnt);
    html += narr("Recommended Action",f.nearMiss.recommendedAction);
  }
  const anyType = f.types.injury||f.types.vehicle||f.types.property||f.types.nearMiss;
  if (anyType) {
    html += heading("Investigation","#1A7A3A");
    if (f.investigation.conditions?.length) html += chips(f.investigation.conditions);
    html += narr("Root Cause Analysis",f.investigation.rootCause);
    const acts = f.investigation.actions.filter(a=>a.action);
    if (acts.length) { html += `<table style="margin-top:10px"><tr style="background:#F7F8FA"><th style="text-align:left;padding:6px 10px;font-size:10px">Action</th><th style="text-align:left;padding:6px 10px;font-size:10px">Responsible</th><th style="text-align:left;padding:6px 10px;font-size:10px">Due</th></tr>${acts.map(a=>`<tr><td style="padding:5px 10px;font-size:12px;border-bottom:1px solid #eee">${a.action}</td><td style="padding:5px 10px;font-size:12px;border-bottom:1px solid #eee">${a.person}</td><td style="padding:5px 10px;font-size:12px;border-bottom:1px solid #eee">${a.dueDate}</td></tr>`).join("")}</table>`; }
    html += heading("Notifications");
    html += `<table>${row("Supervisor",f.notifications.supervisor)}${row("Safety/HR",f.notifications.safetyHr)}${row("Client/GC",f.notifications.clientGc)}${row("Insurance",f.notifications.insuranceFleet)}${row("Regulatory",f.notifications.regRequired)}</table>`;
    if (f.notifications.flags?.length) html += chips(f.notifications.flags);
  }
  html += `<div style="margin-top:40px;padding-top:16px;border-top:2px solid #1B2A4A"><div style="display:flex;gap:40px;margin-top:12px"><div style="flex:1"><div style="font-size:10px;color:#5A6578;margin-bottom:24px">Supervisor Signature / Date</div><div style="border-bottom:1px solid #999"></div></div><div style="flex:1"><div style="font-size:10px;color:#5A6578;margin-bottom:24px">Safety / HR Review / Date</div><div style="border-bottom:1px solid #999"></div></div></div><div style="display:flex;gap:40px;margin-top:20px"><div style="flex:1"><div style="font-size:10px;color:#5A6578;margin-bottom:24px">Management Review / Date</div><div style="border-bottom:1px solid #999"></div></div><div style="flex:1"></div></div></div>`;
  html += `</div></body></html>`;

  const w = window.open("","_blank");
  if (w) { w.document.write(html); w.document.close(); setTimeout(() => w.print(), 400); }
}

renderDraftList();
